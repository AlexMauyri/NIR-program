services:
  postgres-db:
    image: postgres:18.4-alpine
    container_name: postgres-db 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - nir_network

  mlflow:
    image: burakince/mlflow:3.7.0
    container_name: mlflow-server
    depends_on:
      postgres-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://0.0.0.0:5000
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/mlflow_db
      MLFLOW_REGISTRY_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/mlflow_db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow/
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/mlflow_db
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
    restart: always
    networks:
      - nir_network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-storage
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - nir_network

  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb local/mlflow --ignore-existing &&
      mc mb local/ml-features --ignore-existing &&
      mc anonymous set download local/ml-features &&
      echo 'Buckets created'
      "
    networks:
      - nir_network

  prefect-server:
    image: prefecthq/prefect:3.3.0-python3.12
    container_name: prefect-server
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/prefect_db
      PREFECT_HOME: /data
    ports:
      - "4200:4200"
    volumes:
      - prefect_data:/data
    command: prefect server start --host 0.0.0.0
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
    networks:
      - nir_network

  prefect-worker:
    image: prefecthq/prefect:3.3.0-python3.12
    container_name: prefect-worker
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - ./src/etl:/opt/etl
    working_dir: /opt/etl
    command: >
      /bin/sh -c "
      pip install uv &&
      uv sync &&
      prefect worker start --pool default --limit 1
      "
    depends_on:
      prefect-server:
        condition: service_started
    restart: always
    networks:
      - nir_network

volumes:
  postgres_data:
    name: postgres_data
  minio_data:
    name: minio_data
  prefect_data:
    name: prefect_data

networks:
  nir_network:
    name: nir_network
    driver: bridge
