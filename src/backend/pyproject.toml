[project]
name = "nir-backend"
version = "0.1.0"
description = "FastAPI backend for stock prices and ML model registry"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "boto3>=1.43.69",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "mlflow>=3.15.1",
    "pandas>=2.3.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
    "xgboost>=3.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "routers"]
